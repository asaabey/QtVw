[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qtvw"
dynamic = ["version"]
description = "A Qt desktop image browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "rarfile>=4.5,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]

[project.scripts]
qtvw = "qtvw.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "qtvw.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
